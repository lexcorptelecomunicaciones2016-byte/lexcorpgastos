<title>LEXCORP · Gastos y Préstamos</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{--bg:#061322;--pn:#0e2038;--pn2:#122743;--ln:#294565;--or:#ff6a13;--tx:#f4f8fc;--mu:#9fb2c8;--ok:#23c483;--bad:#ff5b62;--warn:#f7b731;--blue:#4fa8ff;--shadow:0 18px 60px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#04101d,#081a2f 55%,#061322);color:var(--tx);font:15px/1.45 Arial,Helvetica,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(6,19,34,.95);backdrop-filter:blur(8px);border-bottom:1px solid #17304d}.logo{height:44px;border-radius:8px;background:#fff;padding:3px}.brand b{display:block;font-size:18px}.brand small{color:var(--mu)}.sp{flex:1}.who{font-size:12px;color:var(--mu);text-align:right}
nav{position:sticky;top:65px;z-index:18;display:flex;gap:6px;overflow:auto;padding:8px 12px;background:#071526;border-bottom:1px solid #17304d}nav button{border:1px solid #244563;background:#0c1f35;color:#cbd9e7;padding:9px 13px;border-radius:10px;white-space:nowrap}nav button.on{background:var(--or);color:#fff;border-color:var(--or);font-weight:700}
main{max-width:1220px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 12;background:linear-gradient(180deg,#0e2038,#0b1b30);border:1px solid #24415f;border-radius:14px;box-shadow:var(--shadow);padding:16px}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}@media(max-width:850px){.c6,.c4,.c3{grid-column:span 12}header{align-items:flex-start}.who{max-width:130px}}
h2,h3{margin:0 0 12px}.bar{height:4px;background:var(--or);border-radius:99px;margin:-16px -16px 14px}.kpi{font-size:29px;font-weight:800}.sub{color:var(--mu);font-size:12px}.money{font-variant-numeric:tabular-nums}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
label{display:block;color:#b8c8da;font-size:12px;margin:9px 0 4px}input,select,textarea{width:100%;background:#061426;color:#fff;border:1px solid #31506f;border-radius:9px;padding:11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--or);box-shadow:0 0 0 2px rgba(255,106,19,.14)}textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:620px){.row{grid-template-columns:1fr}}
.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--or);color:#fff;font-weight:700}.btn.alt{background:#17324e}.btn.good{background:#158a61}.btn.bad{background:#a93843}.btn.sm{padding:7px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.table{overflow:auto;border:1px solid #25425e;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:10px;border-bottom:1px solid #203a54;text-align:left;font-size:12px}th{background:#10263e;color:#afc5db;position:sticky;top:0}tr:hover td{background:#10233a}.pill{display:inline-block;border-radius:99px;padding:3px 8px;font-size:11px;background:#17324e}.pill.ok{background:#0d563d;color:#85f0c2}.pill.warn{background:#5c4615;color:#ffd76f}.pill.bad{background:#5a2227;color:#ffb0b5}
.preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.preview img{width:100%;height:150px;object-fit:cover;border-radius:8px;border:1px solid #34516e}@media(max-width:580px){.preview{grid-template-columns:1fr}.preview img{height:200px}}
.login{position:fixed;inset:0;z-index:100;background:rgba(2,10,18,.96);display:grid;place-items:center;padding:18px}.loginbox{width:min(500px,100%);background:#0e2038;border:1px solid #2b4a68;border-top:4px solid var(--or);border-radius:15px;padding:22px;box-shadow:var(--shadow)}.loginlogo{display:block;max-width:290px;width:80%;margin:0 auto 20px;background:#fff;border-radius:10px;padding:5px}.err{color:#ff777d;min-height:20px;margin:9px 0}.toast{position:fixed;left:50%;bottom:28px;z-index:130;transform:translateX(-50%);background:#162b42;border:1px solid #395978;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);max-width:90%;display:none}.toast.show{display:block}.modal{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:18px}.modalbox{width:min(900px,100%);max-height:92vh;overflow:auto;background:#0d1d31;border:1px solid #365370;border-radius:14px;padding:16px}.modal img{max-width:100%;display:block;margin:auto;border-radius:8px}.empty{text-align:center;color:var(--mu);padding:30px}.right{text-align:right}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:480px){.filters{grid-template-columns:1fr}}.pw{position:relative}.pw input{padding-right:50px}.eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:#9fb5cc;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:.18s ease}.eye:hover{background:rgba(255,255,255,.06);color:#fff}.eye:focus-visible{outline:2px solid #ff6a13;outline-offset:2px}.eye svg{width:22px;height:22px;display:block}.live{display:inline-flex;align-items:center;gap:6px;color:#8df0c6;font-size:11px;margin-top:3px}.live:before{content:'';width:8px;height:8px;border-radius:50%;background:#23c483;box-shadow:0 0 0 4px rgba(35,196,131,.12)}.projtag{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:99px;background:#17324e;color:#cfe1f2;font-size:11px}.readonly{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:99px;background:#4b3513;color:#ffd98a;font-size:11px;font-weight:700}
</style>
</head>

async function img(file){if(!file)return'';if(!file.type.startsWith('image/')){toast('Selecciona una imagen');return''}const url=URL.createObjectURL(file);const im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=url});let w=im.width,h=im.height,m=Math.max(w,h),scale=m>1000?1000/m:1;w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(url);let d=c.toDataURL('image/jpeg',.58);if(d.length>420000)d=c.toDataURL('image/jpeg',.45);return d}

  render();

  // Firebase se usa después como sincronización/complemento. Si una regla impide
  // una migración histórica, la contabilidad visible de los Excel permanece intacta.
  if(SY.rol==='admin'){
    try{ await seedHistoricIfNeeded(true); }catch(e){ console.error('Seed histórico:',e); }
    try{ await ensureCriticalCorrections(); }catch(e){ console.error('Correcciones críticas:',e); toast('Datos Excel cargados. Firebase no permitió una corrección automática, pero el Dashboard sigue operativo.'); }
  }
  try{ listen(); }catch(e){ console.error('Tiempo real:',e); toast('Dashboard cargado desde Excel. Sincronización Firebase no disponible temporalmente.'); }
}

let USING_EMBEDDED_FALLBACK=false;
function loadEmbeddedHistoricalFallback(){
  if(!SY)return;
  const withCreated=(x)=>({...x,created:x.created||Date.parse((x.fecha||today())+'T12:00:00')||0});
  EMBED_G=[...MASTER_V15.madrid.gastos,...MASTER_V15.tenjo.gastos].map(withCreated).sort(sortTs);
  EMBED_I=[...MASTER_V15.madrid.ingresos,...MASTER_V15.tenjo.ingresos].map(withCreated).sort(sortTs);
  EMBED_N=[...MASTER_V15.madrid.nomina,...MASTER_V15.tenjo.nomina].map(withCreated).sort(sortTs);
  EMBED_L=[...MASTER_V15.madrid.prestamos,...MASTER_V15.tenjo.prestamos].map(withCreated).sort(sortTs);
  EMBED_D=[...MASTER_V15.madrid.deudas,...MASTER_V15.tenjo.deudas,...MASTER_V15.general.deudas].map(withCreated).sort(sortTs);
  G=[...EMBED_G];I=[...EMBED_I];N=[...EMBED_N];L=[...EMBED_L];D=[...EMBED_D];
  USING_EMBEDDED_FALLBACK=true;
}
function listen(){
  unsub.forEach(f=>f());unsub=[];
  const P=DB.collection('finanzas').doc(ROOT);
  const all=SY.rol==='admin'||isReadOnly();
  const make=(col)=>all?P.collection(col):P.collection(col).where('uid','==',SY.uid);
  const merge=(target,base,q,mapFn,col)=>{
    const merged=new Map(base.map(x=>[x.id,{...x}]));
    q.docs.map(mapFn).forEach(x=>{
      // V15: los históricos se toman exclusivamente de los Excel originales reconstruidos.
      // Firestore complementa solo movimientos nuevos creados desde la plataforma.
      if(x.historico===true || String(x.id||'').startsWith('hist_') || String(x.id||'').startsWith('tenjo_') || String(x.id||'').startsWith('madrid_')) return;
      merged.set(x.id,x);
    });
    target.splice(0,target.length,...Array.from(merged.values()).sort(sortTs));
    USING_EMBEDDED_FALLBACK=true;
    render();
  };
  const fail=(col,e)=>{console.error('Firestore '+col,e);toast('Firebase no pudo leer '+col+'. El Dashboard conserva los datos de los Excel originales.');render()};
  unsub.push(make('gastos').onSnapshot(q=>merge(G,EMBED_G,q,d=>({id:d.id,...d.data()}),'gastos'),e=>fail('gastos',e)));
  if(all){unsub.push(P.collection('ingresos').onSnapshot(q=>merge(I,EMBED_I,q,d=>({id:d.id,...d.data()}),'ingresos'),e=>fail('ingresos',e)))}else I=[...EMBED_I];
  unsub.push(make('prestamos').onSnapshot(q=>merge(L,EMBED_L,q,d=>({id:d.id,...d.data()}),'prestamos'),e=>fail('préstamos',e)));
  unsub.push(make('deudas_tecnicos').onSnapshot(q=>merge(D,EMBED_D,q,d=>({id:d.id,...d.data()}),'deudas'),e=>fail('deudas',e)));
  unsub.push(make('nomina').onSnapshot(q=>merge(N,EMBED_N,q,d=>({id:d.id,...d.data()}),'nomina'),e=>fail('nómina',e)));
}

sc(x.proyecto||'—')}</div></div><div class="cell"><div class="lbl">Modo de pago</div><div class="val">${esc(x.modo||'—')}</div></div></div><div class="row"><div class="cell"><div class="lbl">Valor prestado</div><div class="val amount">${money(x.valor)}</div></div><div class="cell"><div class="lbl">Saldo actual</div><div class="val amount">${money(saldo)}</div></div></div><div class="cell"><div class="lbl">Asunto / motivo</div><div class="val">${esc(x.asunto||'—')}</div></div><div class="cell"><div class="lbl">Observaciones</div><div class="val" style="font-weight:400">${esc(x.observaciones||'Sin observaciones')}</div></div></div><div class="note"><b>Constancia:</b> Se deja registro del préstamo relacionado en este comprobante, incluyendo beneficiario, valor, fecha y medio de entrega. Documento generado desde LEXCORP · Contabilidad PRO.</div><div class="sign"><div class="line">Firma / autorización LEXCORP</div><div class="line">Firma beneficiario</div></div><div class="foot">Generado ${nowText()} · Usuario: ${esc(SY.nombre)} · ${folio}</div></div><script>window.onload=()=>{setTimeout(()=>window.print(),350)}<\/script></body></html>`;
  const w=window.open('','_blank');if(!w)return toast('Permite ventanas emergentes para generar el comprobante');w.document.open();w.document.write(html);w.document.close();
}
async function editG(i){const x=G.find(z=>z.id===i);if(!x)return;const valor=prompt('Valor del gasto:',x.valor);if(valor===null)return;const concepto=prompt('Concepto:',x.concepto);if(concepto===null)return;const proyecto=prompt('Proyecto:',x.proyecto||'');if(proyecto===null)return;const pago=prompt('Medio de pago:',x.pago);if(pago===null)return;const upd={valor:+valor||0,concepto:concepto.trim(),proyecto:proyecto.trim(),pago:pago.trim(),editadoPor:SY.nombre,editadoTs:firebase.firestore.FieldValue.serverTimestamp()};await DB.collection('finanzas').doc(ROOT).collection('gastos').doc(i).update(upd);driveBackup('gasto','editar',{id:i,...x,...upd});toast('Gasto actualizado')}

async function exportExcel(gastos,prest,nomina=N,ingresos=I,deudas=D){const wb=new ExcelJS.Workbook();wb.creator='LEXCORP Telecomunicaciones';const ws=wb.addWorksheet('Resumen');ws.addRow(['LEXCORP TELECOMUNICACIONES · CONTROL CONTABLE']);ws.mergeCells('A1:D1');ws.getCell('A1').font={bold:true,size:16};ws.addRow(['Generado',nowText()]);ws.addRow(['Usuario',SY.nombre]);const ti=ingresos.reduce((s,x)=>s+(+x.valor||0),0),tg=gastos.reduce((s,x)=>s+(x.estado==='Rechazado'?0:+x.valor||0),0),tn=nomina.reduce((s,x)=>s+(+x.total||0),0),td=deudas.reduce((s,x)=>s+(x.estado==='Pagado'?0:Math.max(0,(+x.valor||0)-(+x.abonado||0))),0);ws.addRow(['Total entradas',ti]);ws.addRow(['Total gastos',tg]);ws.addRow(['Total nómina',tn]);const tr=deudas.reduce((s,x)=>s+(+x.abonado||0),0);ws.addRow(['Reembolsos / abonos a cuentas por pagar',tr]);ws.addRow(['Flujo neto',ti-tg-tn-tr]);ws.addRow(['Cuentas por pagar pendientes',td]);ws.addRow(['Préstamos pendientes',prest.reduce((s,x)=>s+(x.estado==='Pagado'?0:Math.max(0,(+x.valor||0)-(+x.abonado||0))),0)]);ws.getColumn(1).width=30;ws.getColumn(2).width=28;ws.getColumn(2).numFmt='$#,##0';const wi=wb.addWorksheet('Entradas');wi.addRow(['Fecha','Proyecto','Cliente','Medio','Cuenta / entidad','Referencia','Concepto','Valor','Observaciones','Soporte']);ingresos.forEach(x=>wi.addRow([x.fecha,x.proyecto||'',x.cliente||'',x.modo||'',x.cuenta||'',x.referencia||'',x.concepto||'',+x.valor||0,x.observaciones||'',x.soporte?'Sí':'No']));const wg=wb.addWorksheet('Gastos');wg.addRow(['Fecha','Hora','Proyecto','Usuario','Categoría','Concepto','Proveedor','Factura','Medio','Entidad','Referencia','Valor','Estado','Observaciones','Factura adjunta','Comprobante adjunto']);gastos.forEach(x=>wg.addRow([x.fecha,dt(x.ts),x.proyecto||'',x.tecnico,x.categoria,x.concepto,x.proveedor,x.factura,x.pago,x.entidad,x.referencia,+x.valor||0,x.estado,x.observaciones,x.fotoFactura?'Sí':'No',x.fotoComprobante?'Sí':'No']));const wd=wb.addWorksheet('Cuentas_por_Pagar');wd.addRow(['Fecha','Proyecto','Persona / tercero','Categoría','Concepto','Proveedor','Medio usado','Valor','Abonado','Saldo','Estado','Referencia','Observaciones','Soporte']);deudas.forEach(x=>wd.addRow([x.fecha,x.proyecto||'',x.persona||'',x.categoria||'',x.concepto||'',x.proveedor||'',x.modo||'',+x.valor||0,+x.abonado||0,Math.max(0,(+x.valor||0)-(+x.abonado||0)),x.estado||'',x.referencia||'',x.observaciones||'',x.soporte?'Sí':'No']));const wl=wb.addWorksheet('Prestamos');wl.addRow(['Fecha','Proyecto','Usuario','Persona','Asunto','Modo','Valor','Abonado','Saldo','Estado','Observaciones','Soporte']);prest.forEach(x=>wl.addRow([x.fecha,x.proyecto||'',x.tecnico,x.persona,x.asunto,x.modo,+x.valor||0,+x.abonado||0,Math.max(0,(+x.valor||0)-(+x.abonado||0)),x.estado,x.observaciones,x.soporte?'Sí':'No']));const wn=wb.addWorksheet('Nomina');wn.addRow(['Fecha','Proyecto','Usuario','Colaborador','Periodo','Medio','Base','Bonificaciones','Descuentos','Total','Entidad','Referencia','Concepto','Observaciones','Comprobante']);nomina.forEach(x=>wn.addRow([x.fecha,x.proyecto||'',x.tecnico,x.persona,x.periodo,x.modo,+x.base||0,+x.bonificaciones||0,+x.descuentos||0,+x.total||0,x.entidad,x.referencia,x.concepto,x.observaciones,x.comprobante?'Sí':'No']));[wi,wg,wd,wl,wn].forEach(sh=>{sh.getRow(1).font={bold:true,color:{argb:'FFFFFFFF'}};sh.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0E2038'}};sh.views=[{state:'frozen',ySplit:1}];sh.columns.forEach(c=>c.width=19)});wi.getColumn(8).numFmt='$#,##0';wg.getColumn(12).numFmt='$#,##0';[8,9,10].forEach(c=>wd.getColumn(c).numFmt='$#,##0');[7,8,9].forEach(c=>wl.getColumn(c).numFmt='$#,##0');[7,8,9,10].forEach(c=>wn.getColumn(c).numFmt='$#,##0');const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LEXCORP_Contabilidad_'+today()+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Excel generado')}
